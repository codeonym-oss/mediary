site_name: mediary
site_description: Typed, decorator-driven mediator + CQRS for Python.
site_url: https://codeonym-oss.github.io/mediary/
repo_url: https://github.com/codeonym-oss/mediary
repo_name: codeonym-oss/mediary
edit_uri: edit/main/docs/
copyright: Copyright &copy; codeonym-oss — MIT License
strict: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Dependency injection: guide/dependency-injection.md
      - Behaviors: guide/behaviors.md
      - Notifications: guide/notifications.md
      - Streams: guide/streams.md
      - CQRS: guide/cqrs.md
      - Custom kinds: guide/custom-kinds.md
      - Testing: guide/testing.md
  - Integrations:
      - dishka: integrations/dishka.md
      - FastAPI: integrations/fastapi.md
  - Recipes:
      - Validation: recipes/validation.md
      - Transactions: recipes/transactions.md
      - Caching queries: recipes/caching.md
      - Events after commands: recipes/events.md
  - API reference:
      - mediary: reference/mediary.md
      - mediary.cqrs: reference/cqrs.md
      - mediary.kinds: reference/kinds.md
      - mediary.behaviors: reference/behaviors.md
      - mediary.testing: reference/testing.md
      - mediary.ext.dishka: reference/ext-dishka.md
      - mediary.ext.fastapi: reference/ext-fastapi.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codeonym-oss/mediary
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mediary/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            unwrap_annotated: true

watch:
  - src/mediary
  - README.md
  - CHANGELOG.md
