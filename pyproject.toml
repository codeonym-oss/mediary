[project]
name = "mediary"
version = "0.4.0"
description = "Typed, decorator-driven mediator + CQRS for Python — handlers, pipelines and notifications discovered by package scan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "codeonym-oss" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "mediator", "cqrs", "pipeline", "middleware", "command", "query", "notification",
    "dependency-injection", "asyncio", "anyio", "trio", "dishka", "fastapi", "opentelemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AnyIO",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Framework :: Trio",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/codeonym-oss/mediary"
Documentation = "https://docs.codeonym.work/projects/mediary/"
Repository = "https://github.com/codeonym-oss/mediary"
Issues = "https://github.com/codeonym-oss/mediary/issues"
Changelog = "https://github.com/codeonym-oss/mediary/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
mediary = "mediary.pytest_plugin"

[project.optional-dependencies]
anyio = ["anyio>=4.1"]
dishka = ["dishka>=1.6"]
fastapi = ["fastapi>=0.115"]
otel = ["opentelemetry-api>=1.20"]
full = ["mediary[anyio,dishka,fastapi,otel]"]

[build-system]
requires = ["uv_build>=0.8.22,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# What the tests need; CI runs them with only it and one extra, to test each extra alone.
# AnyIO's pytest plugin runs each async test under asyncio and trio (see tests/conftest.py).
test = [
    "anyio>=4.1",
    "httpx2",
    "pytest>=9",
    "pytest-cov>=7",
    "trio>=0.27",
]
# The OpenTelemetry SDK, whose in-memory exporter the tests of mediary[otel] read spans from.
test-otel = ["opentelemetry-sdk>=1.20"]
dev = [
    {include-group = "test"},
    {include-group = "test-otel"},
    {include-group = "docs"},
    "commitizen>=4.8",
    "pre-commit>=4.3",
    "pyright[nodejs]>=1.1.400",
    "ruff>=0.16",
    # Every extra, so pyright and the full test run see all of mediary.
    "mediary[full]",
]
# The docs site (see CONTRIBUTING.md). Sphinx 9 needs Python 3.12+, so on 3.11 this is empty.
docs = [
    "myst-parser>=5.1; python_version >= '3.12'",
    "shibuya>=2026.7; python_version >= '3.12'",
    "sphinx>=9.1; python_version >= '3.12'",
    "sphinx-autobuild>=2025.8; python_version >= '3.12'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PIE", "RET",
    "TC", "ASYNC", "PERF", "N", "D",
]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings
    "D203", "D213",                  # pick D211 + D212 (summary on the first line)
    "N818",                          # exceptions are named for what happened (HandlerNotFound), no Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.commitizen]
# Only used to validate messages (commit-msg hook + CI); versions and changelog are release-please's job.
name = "cz_conventional_commits"
allowed_prefixes = ["Merge", "Revert", "fixup!", "squash!"]

[tool.pyright]
include = ["src", "tests", "scripts", "benchmarks"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Every `pyright: ignore` must still be needed, so tests can assert that an error is reported.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
# `-p no:mediary` stops our own entry-point plugin from importing mediary before coverage
# starts; tests/conftest.py loads it by module name instead.
addopts = [
    "--strict-markers", "--strict-config", "-ra", "--cov", "--cov-report=term-missing",
    "-p", "no:mediary",
]
testpaths = ["tests"]
xfail_strict = true
# AnyIO's plugin runs every async test once per installed backend: asyncio, and trio.
anyio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mediary"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]
