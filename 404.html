<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mediary docs have moved</title>
  <link rel="canonical" href="https://docs.codeonym.work/projects/mediary/">
  <meta http-equiv="refresh" content="0; url=https://docs.codeonym.work/projects/mediary/">
  <script>
    // /mediary/<version>/<page>/ -> the same page of the stable docs on Read the Docs.
    var path = location.pathname.replace(/^\/mediary\/?/, "").replace(/^(\d+\.\d+|latest|dev)\/?/, "");
    location.replace("https://docs.codeonym.work/projects/mediary/en/stable/" + path + location.hash);
  </script>
</head>
<body>
  <p>The mediary docs have moved to <a href="https://docs.codeonym.work/projects/mediary/">docs.codeonym.work/projects/mediary</a>.</p>
</body>
</html>
