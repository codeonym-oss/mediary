name: release

# On every push to main:
#   - release-please keeps a `chore(main): release X.Y.Z` PR up to date from conventional commits.
#   - When that PR is merged, it tags vX.Y.Z and creates the GitHub release; this run then builds
#     and publishes the release to PyPI (environment `pypi`, needs a maintainer's approval).
#   - Otherwise it publishes a X.Y.(Z+1).devN build to TestPyPI (environment `testpypi`).
#   - Either way it deploys the docs to GitHub Pages (the gh-pages branch), with mike: a
#     release as its X.Y version, aliased `latest` and made the default; otherwise as `dev`,
#     the docs of main, which is the default only until the first release.
# Publishing lives here because tags/releases created with GITHUB_TOKEN don't trigger other
# workflows. PyPI and TestPyPI trust this file name and these environment names (Trusted
# Publishing, OIDC): don't rename them without updating the publishers on PyPI.
#
# Optional secret RELEASE_PLEASE_TOKEN (fine-grained PAT: contents + pull requests read/write)
# makes CI run on the release PR itself; without it a maintainer merges it via ruleset bypass.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    uses: ./.github/workflows/build.yml
    with:
      dev: ${{ needs.release-please.outputs.release_created != 'true' }}

  publish-pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mediary/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mediary/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  docs:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      NO_MKDOCS_2_WARNING: "1"
      TAG: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
          fetch-depth: 0 # mike commits to gh-pages on top of its history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --no-default-groups --group docs
      - name: Deploy with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          mike() { uv run --frozen --no-sync mike "$@"; }
          if [[ -n "$TAG" ]]; then
            version=$(echo "${TAG#v}" | cut -d. -f1,2)
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          else
            mike deploy --push --title "dev (main)" dev
            mike list latest >/dev/null 2>&1 || mike set-default --push dev
          fi
