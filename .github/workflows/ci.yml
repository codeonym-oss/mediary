name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check --output-format=github
      - run: uv run --frozen ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pyright

  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  # The tests with no extra installed, then with each one alone: the tests of missing extras
  # skip, and the core must not need any of them. (AnyIO and trio are test tools, so every run
  # has them: each async test runs under both asyncio and trio.) The otel run adds the SDK, whose
  # in-memory exporter its tests read spans from.
  extras:
    name: extras (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [none, dishka, fastapi, otel]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --no-default-groups --group test ${{ matrix.extra != 'none' && format('--extra {0}', matrix.extra) || '' }} ${{ matrix.extra == 'otel' && '--group test-otel' || '' }}
      - run: uv run --frozen --no-sync pytest --no-cov

  build-check:
    uses: ./.github/workflows/build.yml

  # Warnings are errors: broken links, references and docstrings fail. Read the Docs deploys it
  # (see .readthedocs.yaml), and builds a preview of each pull request.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13" # Sphinx 9 needs 3.12+
      - run: uv sync --frozen --no-default-groups --group docs --extra full
      - run: uv run --frozen --no-sync sphinx-build -W --keep-going -b dirhtml docs docs/_build/html

  # Single stable check name for the branch ruleset, independent of the matrix.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, extras, build-check, docs]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::A required CI job did not succeed"; exit 1
          fi
